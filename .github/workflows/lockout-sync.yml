name: Lockout sync

on:
  schedule:
    # Tuesday 10:00 AM ET (14:00 UTC)
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report without opening a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockout-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python assets/py/test_lockout_sync.py

      - name: Scan strategy.md
        run: python assets/py/lockout_sync.py --scan-only

      - name: Sync lockouts from PQDI
        run: |
          mkdir -p "$RUNNER_TEMP/pqdi"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python assets/py/lockout_sync.py --dry-run \
              --cache-dir "$RUNNER_TEMP/pqdi" \
              --report lockout-sync-report.md \
              --delay 0.25
          else
            python assets/py/lockout_sync.py --apply \
              --cache-dir "$RUNNER_TEMP/pqdi" \
              --report lockout-sync-report.md \
              --delay 0.25
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f lockout-sync-report.md ]; then
            cat lockout-sync-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open PR if lockout boxes changed
        if: github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update Respawn Time from PQDI

            Tuesday lockout sync. Review NPC matches before merge.
          title: Lockout sync — PQDI respawn timers
          body-path: lockout-sync-report.md
          branch: lockout-sync
          delete-branch: true
          add-paths: |
            strategy/**
