name: Lockout sync

on:
  schedule:
    # Tuesday 10:00 PM ET (02:00 UTC Wednesday)
    - cron: '0 2 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report without opening a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockout-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use LF in this job
        run: |
          git config core.autocrlf false
          git config core.eol lf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python assets/py/test_lockout_sync.py

      - name: Scan strategy.md
        run: python assets/py/lockout_sync.py --scan-only

      - name: Sync lockouts from PQDI
        run: |
          mkdir -p "$RUNNER_TEMP/pqdi"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python assets/py/lockout_sync.py --dry-run \
              --cache-dir "$RUNNER_TEMP/pqdi" \
              --report lockout-sync-report.md \
              --delay 0.25
          else
            python assets/py/lockout_sync.py --apply \
              --cache-dir "$RUNNER_TEMP/pqdi" \
              --report lockout-sync-report.md \
              --delay 0.25
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f lockout-sync-report.md ]; then
            cat lockout-sync-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open PR if lockout boxes changed
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B lockout-sync
          git add -- strategy
          if git diff --cached --quiet; then
            echo "No lockout box changes."
            exit 0
          fi
          git commit -m "Update Respawn Time from PQDI" \
            -m "Tuesday lockout sync. Review NPC matches before merge."
          git push --force origin HEAD:lockout-sync
          PR=$(gh pr list --head lockout-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "Lockout sync — PQDI respawn timers" --body-file lockout-sync-report.md
          else
            gh pr create --title "Lockout sync — PQDI respawn timers" \
              --body-file lockout-sync-report.md \
              --base "${{ github.ref_name }}" \
              --head lockout-sync
          fi
